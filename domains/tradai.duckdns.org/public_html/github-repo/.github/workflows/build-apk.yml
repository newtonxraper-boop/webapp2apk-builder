name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Run Resource Generator
        run: python3 scripts/generate_resources.py
      - name: Build APK with Gradle
        run: |
          cd android-template
          chmod +x gradlew
          ./gradlew assembleRelease
