<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Offline</title>
<style>
  html, body {
    margin: 0; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: #0f1115; color: #e8eaed;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
  }
  .box { text-align: center; padding: 32px; }
  .box h1 { font-size: 18px; margin: 0 0 8px; }
  .box p { color: #9aa0a6; font-size: 13px; margin: 0 0 20px; }
  button {
    padding: 10px 20px; border: none; border-radius: 8px;
    background: #3ddc84; color: #04150a; font-weight: 700;
    font-size: 13px; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>Can't reach the app right now</h1>
    <p>Check your internet connection and try again.</p>
    <button onclick="location.href='{{APP_URL}}'">Retry</button>
  </div>
</body>
</html>
