name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: false
        default: 'WebApp'
      app_url:
        description: 'App URL'
        required: false
        default: 'https://example.com'
      package_name:
        description: 'Package Name / applicationId (e.g. com.example.myapp). Leave blank to auto-generate from App Name.'
        required: false
        default: ''
      request_id:
        description: 'Internal request/build ID (optional)'
        required: false
        default: ''
      icon_url:
        description: 'Icon URL'
        required: false
      primary_color:
        description: 'Primary Color'
        required: false
      accent_color:
        description: 'Accent Color'
        required: false
      splash_enabled:
        description: 'Splash Enabled'
        required: false
      push_enabled:
        description: 'Push Enabled'
        required: false
      filecamera_enabled:
        description: 'File Camera Enabled'
        required: false
      nav_items_b64:
        description: 'Nav Items Base64'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate app resources
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_URL: ${{ inputs.app_url }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python3 scripts/generate_resources.py

      - name: Show generated build.gradle and AndroidManifest.xml (debug)
        run: |
          echo "----- app/build.gradle -----"
          cat android-template/app/build.gradle
          echo "----- AndroidManifest.xml -----"
          cat android-template/app/src/main/AndroidManifest.xml

      - name: Generate debug keystore if missing
        run: |
          if [ ! -f android-template/app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore android-template/app/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        run: |
          cd android-template
          gradle assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android-template/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
