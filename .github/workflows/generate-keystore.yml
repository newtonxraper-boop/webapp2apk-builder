name: Generate Persistent Keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate debug keystore if missing
        run: |
          if [ -f android-template/app/debug.keystore ]; then
            echo "Keystore already exists - nothing to do. Every app's signing certificate is already permanent."
            exit 0
          fi
          keytool -genkeypair -v \
            -keystore android-template/app/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Commit and push the keystore
        run: |
          if [ ! -f android-template/app/debug.keystore ]; then
            echo "No keystore to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f android-template/app/debug.keystore
          if git diff --cached --quiet; then
            echo "Nothing new to commit - keystore was already tracked."
            exit 0
          fi
          git commit -m "Add persistent signing keystore so future builds can update cleanly"
          git push
