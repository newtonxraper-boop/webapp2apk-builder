name: Generate Release Keystore (one-time setup)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate a real keystore with random passwords and print setup instructions
        run: |
          STORE_PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          # PKCS12 keystores (keytool's default format) do not support a key
          # password different from the store password - keytool silently
          # ignores -keypass if it differs, which caused signing failures.
          # Use one password for both to avoid that mismatch.
          KEY_PASS="$STORE_PASS"

          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -alias releasekey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=WebApp2Apk,O=WebApp2Apk,C=UG"

          BASE64=$(base64 -w0 release.keystore)

          {
            echo "## Release keystore generated"
            echo ""
            echo "This keystore was **not** committed anywhere - it only exists in this log, right now."
            echo "Copy these four values into **Settings -> Secrets and variables -> Actions -> New repository secret**"
            echo "one at a time, using the exact names below. Once you navigate away from this page, this output is gone for good."
            echo ""
            echo "### 1. \`RELEASE_KEYSTORE_BASE64\`"
            echo '```'
            echo "$BASE64"
            echo '```'
            echo ""
            echo "### 2. \`RELEASE_KEYSTORE_PASSWORD\`"
            echo '```'
            echo "$STORE_PASS"
            echo '```'
            echo ""
            echo "### 3. \`RELEASE_KEY_ALIAS\`"
            echo '```'
            echo "releasekey"
            echo '```'
            echo ""
            echo "### 4. \`RELEASE_KEY_PASSWORD\`"
            echo '```'
            echo "$KEY_PASS"
            echo '```'
            echo ""
            echo "---"
            echo ""
            echo "**Also save the base64 value from step 1 somewhere safe outside GitHub** (a password manager, encrypted note, etc.)."
            echo "If it's ever lost, you can never publish an update to an app already installed on someone's phone under this signature -"
            echo "you'd have to ship it to them as a brand new, separate app instead."
            echo ""
            echo "Once all four secrets are added, every future Build APK run will automatically use this real keystore instead of the debug one."
          } >> "$GITHUB_STEP_SUMMARY"
